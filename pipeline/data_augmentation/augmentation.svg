<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <!-- the flying spaghetti monster, drawn inside a 120 x 120 box -->
    <g id="fsm">
      <g fill="none" stroke="#e0a53c" stroke-width="4" stroke-linecap="round">
        <path d="M34 66 q-16 14 -10 30 q5 13 -4 20"/>
        <path d="M48 72 q-10 20 -2 34 q5 9 -2 14"/>
        <path d="M72 72 q10 20 2 34 q-5 9 2 14"/>
        <path d="M86 66 q16 14 10 30 q-5 13 4 20"/>
        <path d="M40 62 q20 -10 40 0"/>
      </g>
      <circle cx="46" cy="58" r="14" fill="#b5471f"/>
      <circle cx="74" cy="58" r="14" fill="#b5471f"/>
      <g stroke="#e0a53c" stroke-width="5" stroke-linecap="round">
        <path d="M52 46 L42 26"/>
        <path d="M68 46 L78 26"/>
      </g>
      <circle cx="40" cy="22" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
      <circle cx="80" cy="22" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
      <circle cx="41" cy="22" r="3.5" fill="#222222"/>
      <circle cx="79" cy="22" r="3.5" fill="#222222"/>
    </g>

    <!-- same monster, colours turned around the wheel -->
    <g id="fsm-hue">
      <g fill="none" stroke="#3ca0e0" stroke-width="4" stroke-linecap="round">
        <path d="M34 66 q-16 14 -10 30 q5 13 -4 20"/>
        <path d="M48 72 q-10 20 -2 34 q5 9 -2 14"/>
        <path d="M72 72 q10 20 2 34 q-5 9 2 14"/>
        <path d="M86 66 q16 14 10 30 q-5 13 4 20"/>
        <path d="M40 62 q20 -10 40 0"/>
      </g>
      <circle cx="46" cy="58" r="14" fill="#1f66b5"/>
      <circle cx="74" cy="58" r="14" fill="#1f66b5"/>
      <g stroke="#3ca0e0" stroke-width="5" stroke-linecap="round">
        <path d="M52 46 L42 26"/>
        <path d="M68 46 L78 26"/>
      </g>
      <circle cx="40" cy="22" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
      <circle cx="80" cy="22" r="9" fill="#ffffff" stroke="#333333" stroke-width="2"/>
      <circle cx="41" cy="22" r="3.5" fill="#222222"/>
      <circle cx="79" cy="22" r="3.5" fill="#222222"/>
    </g>

    <!-- thumbs down badge -->
    <g id="thumbsdown">
      <circle cx="0" cy="0" r="19" fill="#c0392b"/>
      <g transform="translate(-13,-13) scale(1.08) rotate(180 12 12)" fill="#ffffff">
        <rect x="2.5" y="3" width="5" height="11.5" rx="1.2"/>
        <path d="M9.5 14.5 L13.8 3.2 c1.5 0.2 2.4 1.4 2.4 2.8 V10.2 h4.3 c1.3 0 2.2 1.2 1.9 2.5 l-1.7 7 c-0.2 1 -1.1 1.7 -2.1 1.7 H9.5 Z"/>
      </g>
    </g>
  </defs>

  <rect width="960" height="470" fill="#ffffff"/>

  <text x="40" y="38" font-size="21" font-weight="bold" fill="#1a1a1a">Automated data augmentation: the label has to survive</text>

  <!-- row 1: the letter R -->
  <text x="40" y="70" font-size="14" fill="#555555">A letter R. Flipping it makes it something else.</text>

  <rect x="40" y="82" width="120" height="120" fill="none" stroke="#cccccc"/>
  <svg x="40" y="82" width="120" height="120" viewBox="0 0 120 120">
    <text x="60" y="92" font-size="96" font-family="Georgia, serif" font-weight="bold" text-anchor="middle" fill="#1a1a1a">R</text>
  </svg>
  <text x="100" y="222" font-size="13" text-anchor="middle" fill="#333333">original</text>

  <rect x="190" y="82" width="120" height="120" fill="none" stroke="#cccccc"/>
  <svg x="190" y="82" width="120" height="120" viewBox="0 0 120 120">
    <g transform="translate(120,0) scale(-1,1)">
      <text x="60" y="92" font-size="96" font-family="Georgia, serif" font-weight="bold" text-anchor="middle" fill="#1a1a1a">R</text>
    </g>
  </svg>
  <use href="#thumbsdown" transform="translate(305,90)"/>
  <text x="250" y="222" font-size="13" text-anchor="middle" fill="#c0392b">flip: not an R</text>

  <rect x="340" y="82" width="120" height="120" fill="none" stroke="#cccccc"/>
  <svg x="340" y="82" width="120" height="120" viewBox="0 0 120 120">
    <g transform="translate(-40,-38) scale(1.65)">
      <text x="60" y="92" font-size="96" font-family="Georgia, serif" font-weight="bold" text-anchor="middle" fill="#1a1a1a">R</text>
    </g>
  </svg>
  <text x="400" y="222" font-size="13" text-anchor="middle" fill="#333333">crop</text>

  <rect x="490" y="82" width="120" height="120" fill="none" stroke="#cccccc"/>
  <svg x="490" y="82" width="120" height="120" viewBox="0 0 120 120">
    <g transform="rotate(-90 60 60)">
      <text x="60" y="92" font-size="96" font-family="Georgia, serif" font-weight="bold" text-anchor="middle" fill="#1a1a1a">R</text>
    </g>
  </svg>
  <text x="550" y="222" font-size="13" text-anchor="middle" fill="#333333">rotate 90</text>

  <rect x="640" y="82" width="120" height="120" fill="none" stroke="#cccccc"/>
  <svg x="640" y="82" width="120" height="120" viewBox="0 0 120 120">
    <text x="60" y="92" font-size="96" font-family="Georgia, serif" font-weight="bold" text-anchor="middle" fill="#8c8c8c">R</text>
  </svg>
  <text x="700" y="222" font-size="13" text-anchor="middle" fill="#333333">brightness</text>

  <rect x="790" y="82" width="120" height="120" fill="none" stroke="#cccccc"/>
  <svg x="790" y="82" width="120" height="120" viewBox="0 0 120 120">
    <text x="60" y="92" font-size="96" font-family="Georgia, serif" font-weight="bold" text-anchor="middle" fill="#2f7fb8">R</text>
  </svg>
  <text x="850" y="222" font-size="13" text-anchor="middle" fill="#333333">hue</text>

  <!-- row 2: the flying spaghetti monster -->
  <text x="40" y="272" font-size="14" fill="#555555">The Flying Spaghetti Monster. Every variation is still the Flying Spaghetti Monster.</text>

  <rect x="40" y="284" width="120" height="120" fill="none" stroke="#cccccc"/>
  <svg x="40" y="284" width="120" height="120" viewBox="0 0 120 120"><use href="#fsm"/></svg>
  <text x="100" y="424" font-size="13" text-anchor="middle" fill="#333333">original</text>

  <rect x="190" y="284" width="120" height="120" fill="none" stroke="#cccccc"/>
  <svg x="190" y="284" width="120" height="120" viewBox="0 0 120 120">
    <g transform="translate(120,0) scale(-1,1)"><use href="#fsm"/></g>
  </svg>
  <text x="250" y="424" font-size="13" text-anchor="middle" fill="#333333">flip</text>

  <rect x="340" y="284" width="120" height="120" fill="none" stroke="#cccccc"/>
  <svg x="340" y="284" width="120" height="120" viewBox="0 0 120 120">
    <g transform="translate(-30,-25) scale(1.55)"><use href="#fsm"/></g>
  </svg>
  <text x="400" y="424" font-size="13" text-anchor="middle" fill="#333333">crop</text>

  <rect x="490" y="284" width="120" height="120" fill="none" stroke="#cccccc"/>
  <svg x="490" y="284" width="120" height="120" viewBox="0 0 120 120">
    <g transform="rotate(-90 60 60)"><use href="#fsm"/></g>
  </svg>
  <text x="550" y="424" font-size="13" text-anchor="middle" fill="#333333">rotate 90</text>

  <rect x="640" y="284" width="120" height="120" fill="none" stroke="#cccccc"/>
  <svg x="640" y="284" width="120" height="120" viewBox="0 0 120 120">
    <use href="#fsm"/>
    <rect width="120" height="120" fill="#ffffff" opacity="0.45"/>
  </svg>
  <text x="700" y="424" font-size="13" text-anchor="middle" fill="#333333">brightness</text>

  <rect x="790" y="284" width="120" height="120" fill="none" stroke="#cccccc"/>
  <svg x="790" y="284" width="120" height="120" viewBox="0 0 120 120"><use href="#fsm-hue"/></svg>
  <text x="850" y="424" font-size="13" text-anchor="middle" fill="#333333">hue</text>
</svg>
